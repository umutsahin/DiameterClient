plugins {
    id 'application'
    id 'maven-publish'
}

group 'org.usahin'
version ''

repositories {
    mavenCentral()
}

def os = System.getProperty("os.arch")

dependencies {
    implementation("jakarta.xml.bind:jakarta.xml.bind-api:4.0.1")
    implementation project(":diameter")
    implementation("io.vertx:vertx-core:4.5.15")
    implementation("io.vertx:vertx-config:4.5.15")
    if (System.getProperty("os.arch") == "aarch64") {
        implementation "io.netty:netty-resolver-dns-native-macos:4.1.121.Final:osx-aarch_64"
    }
    implementation 'org.jline:jline:3.30.0'
    implementation 'org.jline:jline-terminal-jni:3.30.0'

    // Testing Dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation 'io.vertx:vertx-junit5:4.5.15' // For VertxTestContext and Vert.x specific JUnit 5 extensions
    testImplementation 'org.mockito:mockito-core:5.10.0' // Mockito for mocking dependencies
    testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0' // Mockito integration with JUnit 5

    // OpenTelemetry
    implementation(platform("io.opentelemetry:opentelemetry-bom:1.51.0"))
    implementation("io.opentelemetry:opentelemetry-api")
    implementation("io.opentelemetry:opentelemetry-sdk")
    implementation("io.opentelemetry:opentelemetry-exporter-otlp")
    implementation("io.opentelemetry:opentelemetry-sdk-extension-autoconfigure")
    // End OpenTelemetry
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.optiva.MainVerticle' // Changed this line
}

tasks.register("singleLocal", JavaExec) {
    args "127.0.0.1", "3868", "0"
    mainClass = 'com.optiva.DiameterClient'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register("loadLocal", JavaExec) {
    args "127.0.0.1", "3868", "100"
    mainClass = 'com.optiva.DiameterClient'
    classpath = sourceSets.main.runtimeClasspath
}

jar {
    manifest {
        attributes "Main-Class": "com.optiva.MainVerticle" // Changed this line
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version

            from components.java
        }
    }
}